<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11120f"><meta name="description" content="SetRoom turns a LEGO collection into a display plan, build diary, selling desk and smarter buying list."><title>SetRoom — Make room for the next build</title><style>html,body{height:100%;margin:0;background:#f4f1e8;color:#11120f;font-family:Arial,sans-serif}main{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}div{border:1px solid #11120f;padding:28px;max-width:460px;box-shadow:8px 8px 0 #d0ff22;background:#fffdf6}b{display:block;font-size:32px;letter-spacing:-1px}p{line-height:1.5}small{font-family:monospace}</style></head><body><main><div><b>SETROOM</b><p id="status">Opening your collection workspace…</p><small>STATIC WEB RELEASE</small></div></main><script>(async()=>{try{const files=['release/payload.000.txt','release/payload.001.txt','release/payload.002.txt','release/payload.003.txt'],text=(await Promise.all(files.map(file=>fetch(file,{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('Release file missing: '+file);return response.text()})))).join(''),raw=atob(text.replace(/\s/g,'')),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')),markup=await new Response(stream).text();document.open();document.write(markup);document.close()}catch(error){document.getElementById('status').textContent='SetRoom could not open. Refresh once, then use a current Chrome, Edge, Safari or Firefox browser.';console.error(error)}})();</script></body></html>
