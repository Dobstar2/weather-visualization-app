name: Publish SetRoom 3D redesign

on:
  push:
    branches:
      - agent/setroom-3d-shelf-redesign
    paths:
      - 'setroom-redesign-release/READY'

permissions:
  contents: write

concurrency:
  group: publish-setroom-3d-redesign
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4

      - name: Apply and validate tested redesign
        shell: bash
        run: |
          cat setroom-redesign-release/patch.b64.* | base64 --decode > /tmp/setroom-redesign.patch.xz
          echo "14f9303818b2ce601322ae5e540889bd12ca87a4eecca1568b2468bbd6d5b7a3  /tmp/setroom-redesign.patch.xz" | sha256sum -c -
          xz -dc /tmp/setroom-redesign.patch.xz > /tmp/setroom-redesign.patch
          patch -p1 < /tmp/setroom-redesign.patch
          node --check setroom/app.js
          node --check setroom/shelf3d.js
          node --check setroom/data.js
          node --check setroom/sw.js
          node setroom/tests/smoke.js
          python3 -m json.tool setroom/manifest.webmanifest >/dev/null
          test -f setroom/index.html
          test -f setroom/upgrade.css

      - name: Commit clean source only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r setroom-redesign-release
          git rm .github/workflows/publish-setroom-redesign.yml
          git add setroom
          git commit -m "Redesign SetRoom 3D shelf experience"
          git push
