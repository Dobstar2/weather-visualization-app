name: Publish SetRoom source

on:
  push:
    branches: [main]
    paths:
      - 'setroom-release/**'
      - '.github/workflows/publish-setroom.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-setroom
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct validated SetRoom release
        shell: bash
        run: |
          cat setroom-release/setroom.b64.* | base64 --decode > /tmp/SetRoom-GitHub-Pages.zip
          echo "2d5f16c3e2a9e0ae67ebed6ed60f47709ccc54bae143ae501da1938051e1ca12  /tmp/SetRoom-GitHub-Pages.zip" | sha256sum -c -
          rm -rf setroom
          unzip -q /tmp/SetRoom-GitHub-Pages.zip -d .
          node --check setroom/app.js
          test -f setroom/index.html
          test -f setroom/styles.css

      - name: Commit generated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setroom
          if git diff --cached --quiet; then
            echo "SetRoom is already current."
            exit 0
          fi
          git commit -m "Publish SetRoom web app"
          git push
